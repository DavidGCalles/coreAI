litellm_settings:
  callbacks: ["prometheus"]

model_list:
  # ==========================================================
  # POOL 5: EMBEDDINGS
  # ==========================================================

  - model_name: text-embedding
    litellm_params:
      model: data/model
      custom_llm_provider: openai
      api_base: os.environ/EMBEDDING_API_BASE
      api_key: "infinity-service"
      rpm: 1000
      tpm: 1000000

  # BUG-004 (#58): embeddings de IMAGEN por el gateway. Infinity 0.0.78
  # sirve imágenes por el /embeddings normal con modality: "image" y el
  # input como data URI base64 (data:image/png;base64,...) — el mismo
  # formato multimodal que LiteLLM acepta en /v1/embeddings. Con la
  # entrada en el model_list, estas llamadas generan métricas litellm_*
  # (tokens, requests, spend) y encienden el dashboard coreai-tokens.
  # Nota: litellm_input_tokens_metric_total tokeniza el base64 → cifra
  # inflada para la modalidad imagen (caveat documentado en #58).
  - model_name: image-embedding
    litellm_params:
      model: data/clip_model
      custom_llm_provider: openai
      api_base: os.environ/EMBEDDING_API_BASE
      api_key: "infinity-service"
      rpm: 1000
      tpm: 1000000

  # ==========================================================
  # Local LLM 
  # ==========================================================
  - model_name: local-fallback
    litellm_params:
      # 'openai/' tells LiteLLM to use the generic OpenAI format
      model: openai/local-model 
      # Points to the host machine from inside the container
      api_base: os.environ/LOCAL_LLM_API_BASE #"http://host.docker.internal:1234/v1 for local lmstudio instances"
      api_key: "lm-studio"
      tpm: 1000000
      rpm: 1000

router_settings:
  fallbacks:
    - "crewai-proxy": ["local-fallback"]
    - "router-model": ["local-fallback"]
    - "vision-model": ["local-fallback"]
    - "audio-model": ["local-fallback"]
    - "text-embedding": ["data/model"]
    - "image-embedding": ["data/clip_model"]
  
  allowed_fails: 1
  cooldown_time: 1 