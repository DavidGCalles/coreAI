litellm_settings:
  callbacks: ["prometheus"]

model_list:
  # ==========================================================
  # POOL 5: EMBEDDINGS
  # ==========================================================

  - model_name: text-embedding
    litellm_params:
      model: data/model
      custom_llm_provider: openai
      api_base: os.environ/EMBEDDING_API_BASE
      api_key: "infinity-service"
      rpm: 1000
      tpm: 1000000

  # BUG-004 (#58): embeddings de IMAGEN por el gateway. LiteLLM trae un
  # proveedor infinity/ NATIVO (InfinityEmbeddingConfig) que mapea
  # modality al body del POST /embeddings normal de Infinity 0.0.78
  # (API v2, verificado en #49: input data URI base64). IMPORTANTE: no
  # usar custom_llm_provider: openai aquí — el proveedor openai no
  # soporta modality y lo rechazaría (UnsupportedParamsError). Bonus del
  # proveedor: dimensions → output_dimension (matryoshka jina-clip-v2
  # 1024→64) y encoding_format.
  - model_name: image-embedding
    litellm_params:
      model: infinity/data/clip_model
      api_base: os.environ/EMBEDDING_API_BASE
      api_key: "infinity-service"
      rpm: 1000
      tpm: 1000000

  # ==========================================================
  # Local LLM 
  # ==========================================================
  - model_name: local-fallback
    litellm_params:
      # 'openai/' tells LiteLLM to use the generic OpenAI format
      model: openai/local-model 
      # Points to the host machine from inside the container
      api_base: os.environ/LOCAL_LLM_API_BASE #"http://host.docker.internal:1234/v1 for local lmstudio instances"
      api_key: "lm-studio"
      tpm: 1000000
      rpm: 1000

router_settings:
  # Los fallbacks referencian GRUPOS (model_name), NUNCA ids de modelo:
  # un fallback por id («data/model», «data/clip_model») muere en el
  # router con «You passed in model=data/clip_model. There are no
  # healthy deployments» y su ruido enmascara la causa real del 400 en
  # el error que ve el worker (hallazgo E2E 22 oct, #61).
  # Los embeddings se quedan SIN fallback a propósito: no existe espacio
  # alternativo — caer de clip-1024 a e5-384 sería insertar vectores de
  # otra dimensión en la misma consulta.
  fallbacks:
    - "crewai-proxy": ["local-fallback"]
    - "router-model": ["local-fallback"]
    - "vision-model": ["local-fallback"]
    - "audio-model": ["local-fallback"]
  
  allowed_fails: 1
  cooldown_time: 1 