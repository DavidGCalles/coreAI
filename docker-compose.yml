x-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
    mode: non-blocking
    loki-retries: "3"

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: coreai_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432" ##ONLY DEVELOPMENT!!!!!
    networks:
      - coreai_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-coreai_user} -d $${POSTGRES_DB:-coreai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: coreai_qdrant
    restart: always
    env_file:
      - .env
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    ports:
      - "6333:6333" 
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - coreai_backend

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: coreai_litellm
    ports:
      - "4000:4000"
    volumes:
      - ./src/config/litellm_config.edge.yaml:/app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command: "--config /app/config.yaml --port 4000"
    networks:
      - coreai_frontend
      - coreai_backend
    # BUG-005 (#66): Infinity es el servicio más lento del stack — LiteLLM
    # no arranca hasta que su provider está cargado de verdad.
    depends_on:
      infinity:
        condition: service_healthy
    logging: *loki-logging

  infinity:
    # BUG-007 (#72): nombre explícito — los servicios build sin image: se
    # nombran <proyecto>-<servicio>, y desde stacks incluidos (elios-client)
    # eso fuerza un rebuild imposible (submodule sin modelos en contexto).
    image: coreai/infinity:local
    build:
      context: .
      dockerfile: Dockerfile.infinity
    container_name: coreai_infinity
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    command: ["--model-id", "/data/model", "--model-id", "/data/nli_model", "--model-id", "/data/clip_model"]
    # BUG-005 (#66): la carga de los 3 kits vive en el lifespan de FastAPI —
    # /health (v0.0.78, sin API key) solo responde cuando están cargados:
    # un 200 ES el ready. One-liner Python: curl no garantizado en la imagen CPU.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m ## carga de e5 + NLI + jina-clip-v2 en CPU: minutos
    networks:
      - coreai_backend
    logging: *loki-logging

  core-mcp:
    # BUG-007 (#72): mismo Dockerfile que worker-node → misma imagen.
    image: coreai/core:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coreai_mcp
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      litellm:
        condition: service_started
      infinity:
        condition: service_healthy ## BUG-005 (#66)
    # [ADR-008-002] #77: el service despliega en streamable HTTP —
    # 0.0.0.0:8000, puerto ya mapeado (la red interna del compose).
    # STDIO no vive en el service: cada IDE spawnea su propio proceso
    # con docker exec (patrón Cline intacto).
    command: ["python", "-m", "src.main", "--serving", "http"]
    networks:
      - coreai_frontend
      - coreai_backend
    logging: *loki-logging

  worker-node:
    # BUG-007 (#72): ver core-mcp — una sola build compartida.
    image: coreai/core:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coreai_worker
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      infinity:
        condition: service_healthy ## BUG-005 (#66)
    command: ["python", "-m", "src.worker"]
    networks:
      - coreai_frontend
      - coreai_backend
    logging: *loki-logging

  adminer:
    image: adminer:latest
    container_name: coreai_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coreai_backend

  # ==========================================
  # SUBSISTEMA DE OBSERVABILIDAD
  # ==========================================
  loki:
    image: grafana/loki:latest
    container_name: coreai_loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./data/loki:/loki
    networks:
      - coreai_backend

  prometheus:
    image: prom/prometheus:latest
    container_name: coreai_prometheus
    restart: unless-stopped
    volumes:
      - ./data/prometheus:/prometheus
      - ./src/config/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - coreai_backend

  grafana:
    image: grafana/grafana:latest
    container_name: coreai_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./src/config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    networks:
      - coreai_backend

networks:
  coreai_frontend:
    driver: bridge
  coreai_backend:
    driver: bridge
