services:

  postgres:
    image: pgvector/pgvector:pg15
    container_name: coreai_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432" ##ONLY DEVELOPMENT!!!!!
    networks:
      - coreai_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-coreai_user} -d $${POSTGRES_DB:-coreai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: coreai_qdrant
    restart: always
    env_file:
      - .env
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    ports:
      - "6333:6333" 
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - coreai_backend

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: coreai_litellm
    ports:
      - "4000:4000"
    volumes:
      - ./src/config/litellm_config.edge.yaml:/app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command: "--config /app/config.yaml --port 4000"
    networks:
      - coreai_frontend
      - coreai_backend
    
  infinity:
    build:
      context: .
      dockerfile: Dockerfile.infinity
    container_name: coreai_infinity
    restart: unless-stopped
    env_file:
      - .env
    command: ["--model-id", "/data/model", "--model-id", "/data/nli_model"]
    volumes:
      - ./data/infinity:/models
    networks:
      - coreai_backend

  core-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coreai_mcp
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      litellm:
        condition: service_started
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - coreai_frontend
      - coreai_backend

  worker-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coreai_worker
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["tail", "-f", "/dev/null"]
    networks:
      - coreai_frontend
      - coreai_backend

  adminer:
    image: adminer:latest
    container_name: coreai_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coreai_backend

networks:
  coreai_frontend:
    driver: bridge
  coreai_backend:
    driver: bridge
    #internal: true